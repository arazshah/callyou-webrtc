server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"

      APP_URL: ${APP_URL:?Set APP_URL}

      DATABASE_URL: postgres://${POSTGRES_USER:-callyou}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-callyou}

      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION:?Set SERVICE_BASE64_64_SESSION}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      ROOM_INACTIVITY_HOURS: ${ROOM_INACTIVITY_HOURS:-24}
      RECONNECT_GRACE_SECONDS: ${RECONNECT_GRACE_SECONDS:-30}

      TURN_SHARED_SECRET: ${SERVICE_BASE64_64_TURN:?Set SERVICE_BASE64_64_TURN}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM}
      TURN_HOST: ${TURN_HOST:?Set TURN_HOST}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(r => {
            if (!r.ok) process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
