services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    restart: unless-stopped
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    expose: ['3000']
    command: ['sh', '-c', 'node dist/migrate.js && node dist/index.js']
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
          ],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    environment: { DOMAIN: '${DOMAIN}' }
    depends_on: { server: { condition: service_healthy } }
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['caddy_data:/data', 'caddy_config:/config']
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      [
        '-n',
        '--log-file=stdout',
        '--fingerprint',
        '--use-auth-secret',
        '--static-auth-secret=${TURN_SHARED_SECRET}',
        '--realm=${TURN_REALM}',
        '--external-ip=${TURN_PUBLIC_IP}',
        '--listening-port=3478',
        '--min-port=${TURN_MIN_PORT:-49160}',
        '--max-port=${TURN_MAX_PORT:-49200}',
        '--no-multicast-peers',
        '--no-cli',
      ]
volumes: { postgres_data: {}, caddy_data: {}, caddy_config: {} }
